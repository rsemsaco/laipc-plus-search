name: Landing page QA
on:
  pull_request:
    paths: ['docs/**', 'site-tools/**', '.github/workflows/landing-ci.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'site-tools/**', '.github/workflows/landing-ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static landing
        run: python3 site-tools/check_site.py
      - name: Validate JavaScript syntax
        run: node --check docs/assets/site.js
