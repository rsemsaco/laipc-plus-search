name: LAIPC+ Search Engine

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "stage5"
        type: choice
        options:
          - stage4
          - protocol
          - provider_test
      provider:
        description: "Provider (used only in provider_test mode)"
        required: true
        default: "europe_pmc"
        type: choice
        options:
          - europe_pmc
          - openalex
          - datacite
      query:
        description: "Manual query (used only in provider_test mode)"
        required: true
        default: "chronic stress mice behavioral"
        type: string
      max_results:
        description: "Maximum results per query/provider"
        required: true
        default: "10"
        type: string

permissions:
  contents: read

jobs:
  search:
    name: LAIPC+ search pipeline
    runs-on: ubuntu-24.04
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Stage 5 practical delivery
        if: ${{ inputs.mode == 'stage5' }}
        run: |
          python search.py \
            --mode stage5 \
            --profile config/research_profile.yaml \
            --known-corpus reference/corpus_known.csv \
            --max-results "${{ inputs.max_results }}"

      - name: Run Stage 4 deduplication and corpus comparison
        if: ${{ inputs.mode == 'stage4' }}
        run: |
          python search.py             --mode stage4             --profile config/research_profile.yaml             --known-corpus reference/corpus_known.csv             --max-results "${{ inputs.max_results }}"

      - name: Run Stage 3 protocol-oriented search
        if: ${{ inputs.mode == 'protocol' }}
        run: |
          python search.py             --mode protocol             --profile config/research_profile.yaml             --max-results "${{ inputs.max_results }}"

      - name: Run single-provider test
        if: ${{ inputs.mode == 'provider_test' }}
        run: |
          python search.py             --mode provider_test             --provider "${{ inputs.provider }}"             --query "${{ inputs.query }}"             --max-results "${{ inputs.max_results }}"

      - name: Upload Stage 5 final package
        if: ${{ inputs.mode == 'stage5' }}
        uses: actions/upload-artifact@v7
        with:
          name: laipc-stage5-final-package
          path: |
            outputs/LAIPC_Search.xlsx
            outputs/LAIPC_Search.csv
            outputs/work_handoff.csv
            outputs/search_log.json
            outputs/search_summary.md
            outputs/query_plan.json
            outputs/query_plan.md
            outputs/protocol_raw_results.json
            outputs/stage4_unique_records.json
            outputs/stage4_dedup_audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload Stage 4 artifact
        if: ${{ inputs.mode == 'stage4' }}
        uses: actions/upload-artifact@v7
        with:
          name: laipc-stage4-dedup-known-new
          path: |
            outputs/query_plan.json
            outputs/query_plan.md
            outputs/protocol_raw_results.json
            outputs/stage4_unique_records.json
            outputs/stage4_all_unique.csv
            outputs/stage4_new_candidates.csv
            outputs/stage4_dedup_audit.json
            outputs/stage4_summary.md
          if-no-files-found: error
          retention-days: 7

      - name: Upload Stage 3 protocol artifact
        if: ${{ inputs.mode == 'protocol' }}
        uses: actions/upload-artifact@v7
        with:
          name: laipc-stage3-protocol-search
          path: |
            outputs/query_plan.json
            outputs/query_plan.md
            outputs/protocol_raw_results.json
            outputs/protocol_run_summary.md
          if-no-files-found: error
          retention-days: 7

      - name: Upload provider test artifact
        if: ${{ inputs.mode == 'provider_test' }}
        uses: actions/upload-artifact@v7
        with:
          name: laipc-${{ inputs.provider }}-test
          path: |
            outputs/${{ inputs.provider }}_results.json
            outputs/${{ inputs.provider }}_summary.md
          if-no-files-found: error
          retention-days: 7
