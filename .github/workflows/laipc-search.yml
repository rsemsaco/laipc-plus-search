name: LAIPC+ Search Engine

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Scientific source to test"
        required: true
        default: "datacite"
        type: choice
        options:
          - datacite
          - openalex
          - europe_pmc
      query:
        description: "Search query"
        required: true
        default: "chronic stress mice behavioral"
        type: string
      max_results:
        description: "Maximum number of results"
        required: true
        default: "25"
        type: string

permissions:
  contents: read

jobs:
  provider-test:
    name: Scientific provider connector test
    runs-on: ubuntu-24.04
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Query selected provider
        run: |
          python search.py             --provider "${{ inputs.provider }}"             --query "${{ inputs.query }}"             --max-results "${{ inputs.max_results }}"

      - name: Upload provider test artifact
        uses: actions/upload-artifact@v7
        with:
          name: laipc-${{ inputs.provider }}-test
          path: |
            outputs/${{ inputs.provider }}_results.json
            outputs/${{ inputs.provider }}_summary.md
          if-no-files-found: error
          retention-days: 7
