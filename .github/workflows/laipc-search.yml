name: LAIPC+ Search Engine

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "protocol"
        type: choice
        options:
          - protocol
          - provider_test
      provider:
        description: "Provider (used only in provider_test mode)"
        required: true
        default: "europe_pmc"
        type: choice
        options:
          - europe_pmc
          - openalex
          - datacite
      query:
        description: "Manual query (used only in provider_test mode)"
        required: true
        default: "chronic stress mice behavioral"
        type: string
      max_results:
        description: "Maximum results per query/provider"
        required: true
        default: "10"
        type: string

permissions:
  contents: read

jobs:
  search:
    name: LAIPC+ protocol/provider search
    runs-on: ubuntu-24.04
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run protocol-oriented search
        if: ${{ inputs.mode == 'protocol' }}
        run: |
          python search.py             --mode protocol             --profile config/research_profile.yaml             --max-results "${{ inputs.max_results }}"

      - name: Run single-provider test
        if: ${{ inputs.mode == 'provider_test' }}
        run: |
          python search.py             --mode provider_test             --provider "${{ inputs.provider }}"             --query "${{ inputs.query }}"             --max-results "${{ inputs.max_results }}"

      - name: Upload Stage 3 protocol artifact
        if: ${{ inputs.mode == 'protocol' }}
        uses: actions/upload-artifact@v7
        with:
          name: laipc-stage3-protocol-search
          path: |
            outputs/query_plan.json
            outputs/query_plan.md
            outputs/protocol_raw_results.json
            outputs/protocol_run_summary.md
          if-no-files-found: error
          retention-days: 7

      - name: Upload provider test artifact
        if: ${{ inputs.mode == 'provider_test' }}
        uses: actions/upload-artifact@v7
        with:
          name: laipc-${{ inputs.provider }}-test
          path: |
            outputs/${{ inputs.provider }}_results.json
            outputs/${{ inputs.provider }}_summary.md
          if-no-files-found: error
          retention-days: 7
