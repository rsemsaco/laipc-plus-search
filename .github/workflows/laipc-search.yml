name: LAIPC+ Search Engine

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Search query for the current provider test"
        required: true
        default: "chronic stress mice behavioral"
        type: string
      max_results:
        description: "Maximum number of results"
        required: true
        default: "25"
        type: string

permissions:
  contents: read

jobs:
  europe-pmc-test:
    name: Europe PMC connector test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Query Europe PMC
        run: |
          python search.py             --provider europe_pmc             --query "${{ inputs.query }}"             --max-results "${{ inputs.max_results }}"

      - name: Upload Europe PMC test artifact
        uses: actions/upload-artifact@v7
        with:
          name: laipc-europe-pmc-test
          path: |
            outputs/europe_pmc_results.json
            outputs/europe_pmc_summary.md
          if-no-files-found: error
          retention-days: 7
